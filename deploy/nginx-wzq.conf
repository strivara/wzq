# ============================================================
# 五子棋自托管 · Nginx 反代配置（子域名方案，最干净）
# 用法：把本文件内容放进 /etc/nginx/conf.d/wzq.zigushi.com.conf
#       然后 nginx -t && systemctl reload nginx
# 前提：已添加 DNS A 记录  wzq.zigushi.com -> 服务器公网IP(122.51.60.242)
# ============================================================

server {
    listen 80;
    server_name wzq.zigushi.com;

    # 证书签发用（certbot 会自动改 443，可先保留 80）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        # ↓↓↓ WebSocket 升级，联机对战必须 ↓↓↓
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
